name: MouseFix
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
targets:
  MouseFix:
    type: application
    platform: macOS
    sources:
      - path: MouseFixApp.swift
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: MouseFix
        CFBundleDisplayName: MouseFix
        CFBundleIdentifier: com.local.mousefix
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        NSHighResolutionCapable: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: MouseFix.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO